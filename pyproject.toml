[project]
name = "render2d-svc"
version = "0.1.0"
description = "确定性 2D 绘图 worker：plan-2d-render（母版/确认底图/图层/遮罩），CPU 伸缩轴（V1.4 物理拆分）"
requires-python = ">=3.12"
dependencies = [
  "ishome-contracts",
  "temporalio>=1.8",
  "pydantic>=2.9",
  # 母版是确定性栅格绘制：同一份几何画两次要逐字节相同，走纯 Python 光栅、不引系统级渲染栈
  "pillow>=11",
  # 私有对象存储：母版要交给另一个仓的服务（imagegen 图生图），说明图要发到业主手机上，
  # 一张 1600px 的图不塞进编排的 payload 里传
  "oss2>=2.18",
]

[project.scripts]
render2d-worker = "render2d_worker.worker:main"
render2d = "render2d_worker.cli:main"

[tool.uv.sources]
ishome-contracts = { git = "ssh://git@github.com/tommax-bai/ishome-contracts.git", tag = "v0.2.0", subdirectory = "gen/python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/render2d_worker"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

# ---------------------------------------------------------------------------
# ruff（lint + format）——口径同 ishome-aipipe 根配置
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# ---------------------------------------------------------------------------
# mypy（strict）
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# oss2 不带 py.typed（阿里云 OSS SDK）；定向忽略，勿扩大范围
[[tool.mypy.overrides]]
module = ["oss2", "oss2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# import-linter：模块依赖方向契约（违规挂质量门）。
# 规则来源：《开发规范与代码分层》§1.3；禁 utils/common/helpers 目录。
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["render2d_worker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "worker|cli → activities → plan_brief|style_caption → plan_master → cjk_font → models 单向"
type = "layers"
# 两个入口同层且互不可见（"|" = independent siblings）：`worker` 是 Temporal 入口，
# `cli` 是本地画母版的工具。**cli 不许经 activities**——它是不碰 Temporal 与对象存储的那条路，
# 从它能看见 activities 起，"本地画一张母版不需要起编排"就只是一句承诺而不是结构。
layers = [
  "worker | cli",
  "activities",
  "plan_brief | style_caption",
  "plan_master",
  "cjk_font",
  "models",
]
containers = ["render2d_worker"]

[[tool.importlinter.contracts]]
name = "出站边缘 plan_store 不感知上层：只依赖运行库——写图的那只手看不见图上画了什么"
type = "forbidden"
source_modules = ["render2d_worker.plan_store"]
forbidden_modules = [
  "render2d_worker.models",
  "render2d_worker.cjk_font",
  "render2d_worker.plan_master",
  "render2d_worker.plan_brief",
  "render2d_worker.style_caption",
  "render2d_worker.activities",
  "render2d_worker.cli",
  "render2d_worker.worker",
  "temporalio",
]

[[tool.importlinter.contracts]]
name = "cli 不碰对象存储：本地画一张图不要凭证"
type = "forbidden"
# 上面那条 layers 管不到 `plan_store`（它不在层里），而"CLI 不碰对象存储"此前只是 README 上的
# 一句话。**能自动拦住的不写成纪律**：从这里起它是结构。
source_modules = ["render2d_worker.cli"]
forbidden_modules = ["render2d_worker.plan_store", "oss2"]
