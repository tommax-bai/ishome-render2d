[project]
name = "render2d-svc"
version = "0.1.0"
description = "确定性 2D 绘图 worker：plan-2d-render（母版/确认底图/图层/遮罩），CPU 伸缩轴（V1.4 物理拆分）"
requires-python = ">=3.12"
dependencies = [
  "ishome-contracts",
  "temporalio>=1.8",
  "pydantic>=2.9",
  # 母版是确定性栅格绘制：同一份几何画两次要逐字节相同，走纯 Python 光栅、不引系统级渲染栈
  "pillow>=11",
]

[project.scripts]
render2d-worker = "render2d_worker.worker:main"
render2d = "render2d_worker.cli:main"

[tool.uv.sources]
ishome-contracts = { git = "ssh://git@github.com/tommax-bai/ishome-contracts.git", tag = "v0.2.0", subdirectory = "gen/python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/render2d_worker"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

# ---------------------------------------------------------------------------
# ruff（lint + format）——口径同 ishome-aipipe 根配置
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# ---------------------------------------------------------------------------
# mypy（strict）
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# import-linter：模块依赖方向契约（违规挂质量门）。
# 规则来源：《开发规范与代码分层》§1.3；禁 utils/common/helpers 目录。
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["render2d_worker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "worker|cli → activities → plan_master → models 单向"
type = "layers"
# 两个入口同层且互不可见（"|" = independent siblings）：`worker` 是 Temporal 入口，
# `cli` 是本地画母版的工具。**cli 不许经 activities**——它是不碰 Temporal 与对象存储的那条路，
# 从它能看见 activities 起，"本地画一张母版不需要起编排"就只是一句承诺而不是结构。
layers = [
  "worker | cli",
  "activities",
  "plan_master",
  "models",
]
containers = ["render2d_worker"]
